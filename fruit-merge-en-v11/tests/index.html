<!doctype html><html lang="en"><meta charset="utf-8"><title>Fruit Merge Game — Tests</title><style>body{font:16px/1.8 system-ui;background:#e1f1ec;color:#23383b;max-width:950px;padding:30px;margin:auto}h1{font-size:26px}li{padding:6px}.pass{color:#236a45}.fail{color:#b52f26}</style><h1>Fruit Merge Game — Engine &amp; Ranking Tests</h1><p>These tests execute the game's actual physics, fruit data and ranking storage. Input-handler tests can also be run with Node.js using tests/run.cjs.</p><h2 id="summary">Running…</h2><ol id="results"></ol><a href="../index.html">Back to game</a><script src="../fruits.js"></script><script src="../engine.js"></script><script src="../leaderboard.js"></script><script src="engine.test.js"></script><script src="ranking.test.js"></script><script>const results=[...engineTestResults,...rankingTestResults];document.getElementById('summary').textContent=results.filter(t=>t.passed).length+' / '+results.length+' passed';for(const r of results){const li=document.createElement('li');li.className=r.passed?'pass':'fail';li.textContent=(r.passed?'✓ ':'✕ ')+r.name+(r.error?' — '+r.error:'');document.getElementById('results').append(li)}</script></html>
